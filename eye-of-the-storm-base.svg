<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
<title>Both escaping and returning begin from the your world layer, not the core</title>
<desc>Outlined, unfilled concentric circles for self, your world, and escapes, with both an outward looping line and an inward returning line starting from the your world layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<circle cx="340" cy="260" r="200" fill="none" stroke="#854F0B" stroke-width="1"/>
<circle cx="340" cy="260" r="120" fill="none" stroke="#993C1D" stroke-width="1"/>
<circle cx="340" cy="260" r="55" fill="none" stroke="#0F6E56" stroke-width="1"/>

<circle cx="340" cy="260" r="4" fill="#0F6E56"/>
<text x="340" y="285" text-anchor="middle" fill="#0F6E56" font-family="Georgia, serif" font-size="16" font-weight="600">you</text>

<text x="264" y="216" text-anchor="middle" fill="#993C1D" font-family="Georgia, serif" font-size="14">your world</text>
<text x="201" y="180" text-anchor="middle" fill="#854F0B" font-family="Georgia, serif" font-size="14">escapes</text>

<path d="M400,156 Q490,80 430,50 Q380,90 319,142" fill="none" stroke="#993C1D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<path d="M227,301 Q150,360 300,285" fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

<text x="340" y="495" text-anchor="middle" fill="#5A5347" font-family="Georgia, serif" font-size="14" font-style="italic">Both paths start from the same place —</text>
<text x="340" y="513" text-anchor="middle" fill="#5A5347" font-family="Georgia, serif" font-size="14" font-style="italic">the world you're already living in.</text>
</svg>
