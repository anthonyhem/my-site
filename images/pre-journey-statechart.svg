<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<title>State chart from pre-journey through firsthand experience to realities</title>
<desc>Pre-journey branches into open minded, leading to firsthand experience and then authentic, or preconceptions, a straight line into filtered experiences with a bypass dropping directly to fantasy.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="40" y="180" width="110" height="44" rx="8" fill="none" stroke="#5A5347" stroke-width="1"/>
<text x="95" y="206" text-anchor="middle" fill="#5A5347" font-family="Georgia, serif" font-size="15" font-weight="600">pre-journey</text>

<rect x="300" y="60" width="210" height="220" rx="20" fill="none" stroke="#5A5347" stroke-width="1"/>
<text x="312" y="86" fill="#5A5347" font-family="Georgia, serif" font-size="15" font-weight="600">firsthand experience</text>

<rect x="320" y="186" width="170" height="56" rx="12" fill="none" stroke="#854F0B" stroke-width="1"/>
<text x="405" y="209" text-anchor="middle" fill="#854F0B" font-family="Georgia, serif" font-size="15" font-weight="600">filtered</text>
<text x="405" y="228" text-anchor="middle" fill="#854F0B" font-family="Georgia, serif" font-size="15" font-weight="600">experiences</text>

<rect x="530" y="60" width="105" height="220" rx="20" fill="none" stroke="#5A5347" stroke-width="1"/>
<text x="542" y="86" fill="#5A5347" font-family="Georgia, serif" font-size="15" font-weight="600">realities</text>

<rect x="540" y="90" width="90" height="44" rx="8" fill="none" stroke="#0F6E56" stroke-width="1"/>
<text x="585" y="117" text-anchor="middle" fill="#0F6E56" font-family="Georgia, serif" font-size="15" font-weight="600">authentic</text>

<rect x="540" y="192" width="90" height="44" rx="8" fill="none" stroke="#854F0B" stroke-width="1"/>
<text x="585" y="219" text-anchor="middle" fill="#854F0B" font-family="Georgia, serif" font-size="15" font-weight="600">fantasy</text>

<path d="M150,190 L175,190 L175,112 L300,112" fill="none" stroke="#5A5347" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="225" y="102" text-anchor="middle" fill="#5A5347" font-family="Georgia, serif" font-size="13" font-style="italic">open minded</text>

<path d="M150,214 L320,214" fill="none" stroke="#5A5347" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M270,214 L270,340 L585,340 L585,238" fill="none" stroke="#5A5347" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="235" y="204" text-anchor="middle" fill="#5A5347" font-family="Georgia, serif" font-size="13" font-style="italic">preconceptions</text>

<line x1="510" y1="112" x2="538" y2="112" stroke="#5A5347" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>

<line x1="490" y1="214" x2="538" y2="214" stroke="#5A5347" stroke-width="1.25" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
