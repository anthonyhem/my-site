<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
<title>Choosing yourself grows the core moderately, your world keeps its thickness but shifts outward, and escapes thin</title>
<desc>Three outlined, unfilled concentric circles where the self core is moderately larger, the your world band keeps the same thickness but sits farther out, and the escapes band is thinner than before.</desc>

<circle cx="340" cy="260" r="205" fill="none" stroke="#854F0B" stroke-width="1"/>
<text x="430" y="104" text-anchor="middle" fill="#854F0B" font-family="Georgia, serif" font-size="16" font-weight="600">escapes</text>

<circle cx="340" cy="260" r="155" fill="none" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="137" text-anchor="middle" fill="#993C1D" font-family="Georgia, serif" font-size="16" font-weight="600">your world</text>

<circle cx="340" cy="260" r="90" fill="none" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="265" text-anchor="middle" fill="#0F6E56" font-family="Georgia, serif" font-size="16" font-weight="600">self</text>

<text x="340" y="495" text-anchor="middle" fill="#5A5347" font-family="Georgia, serif" font-size="14" font-style="italic">The core grows. Your world keeps its size,</text>
<text x="340" y="513" text-anchor="middle" fill="#5A5347" font-family="Georgia, serif" font-size="14" font-style="italic">escapes take up less space.</text>
</svg>
