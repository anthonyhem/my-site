<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anthonyhem</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #EAE4D8;
      --ink: #332E28;
      --ink-soft: #5A5347;
      --signature: #6E5A63;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 500;
      font-style: italic;
      line-height: 1.4;
      margin: 0 0 20px;
      letter-spacing: 0.01em;
    }

    p {
      font-size: 17px;
      line-height: 1.75;
      color: var(--ink-soft);
      margin: 0 0 32px;
    }

    .signature {
      font-family: 'Caveat', cursive;
      font-size: 26px;
      color: var(--signature);
    }

    @media (prefers-reduced-motion: no-preference) {
      main {
        animation: settle 0.8s ease-out;
      }
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world.</h1>
    <p>This is a small, quiet space I'm building — for notes, half-formed ideas, and things worth writing down slowly.</p>
    <p class="signature">more soon</p>
  </main>
</body>
</html>
