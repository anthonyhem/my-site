<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>_(┐「ε:)_</title>
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #EAE4D8;
      --ink: #332E28;
      --ink-soft: #5A5347;
      --signature: #6E5A63;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 72px 24px 120px;
    }

    .site-header {
      text-align: center;
      margin-bottom: 88px;
    }

    .site-title {
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 500;
      font-style: italic;
      margin: 0;
      letter-spacing: 0.01em;
      line-height: 1.4;
    }

    .entry-date {
      display: block;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin: 0 0 10px;
    }

    .entry-title {
      font-size: clamp(24px, 5vw, 30px);
      font-weight: 500;
      font-style: italic;
      line-height: 1.35;
      margin: 0 0 36px;
      letter-spacing: 0.01em;
    }

    .entry-body p {
      font-size: 17px;
      line-height: 1.85;
      color: var(--ink);
      margin: 0 0 30px;
    }

    .entry-body em {
      font-style: italic;
    }

    .entry-image {
      display: block;
      width: 100%;
      max-width: 380px;
      height: auto;
      margin: 48px auto;
    }

    .video-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin: 8px 0 44px;
    }

    .video-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-link {
      display: block;
      text-decoration: none;
      margin: 8px 0 44px;
    }

    .video-link .entry-image {
      max-width: 100%;
      margin: 0 0 10px;
    }

    .video-link-label {
      display: block;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      transition: color 0.2s ease;
    }

    .video-link:hover .video-link-label,
    .video-link:focus-visible .video-link-label {
      color: var(--ink);
    }

    .site-footer {
      margin-top: 96px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
    }

    /* -------- View switching (no page reload) -------- */

    .view[hidden] { display: none; }

    @media (prefers-reduced-motion: no-preference) {
      .fade-in { animation: fadeIn 0.5s ease; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* -------- Entry navigation -------- */

    .entry-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin-top: 72px;
    }

    .nav-arrow {
      font-size: 20px;
      line-height: 1;
      color: var(--ink-soft);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .nav-arrow:hover, .nav-arrow:focus-visible { color: var(--ink); }
    .nav-arrow--disabled { opacity: 0.25; pointer-events: none; }

    .nav-legend {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .nav-legend:hover, .nav-legend:focus-visible {
      color: var(--ink);
      border-color: var(--ink-soft);
    }

    /* -------- Legend (all entries) -------- */

    .legend-title {
      font-size: clamp(22px, 5vw, 26px);
      font-weight: 500;
      font-style: italic;
      text-align: center;
      margin: 0 0 56px;
    }

    .legend-list {
      list-style: none;
      margin: 0 0 64px;
      padding: 0;
    }
    .legend-list li + li {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid rgba(51, 46, 40, 0.12);
    }
    .legend-list a {
      display: block;
      text-decoration: none;
      color: var(--ink);
    }
    .legend-date {
      display: block;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    .legend-entry-title {
      display: block;
      font-size: 19px;
      font-style: italic;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    .legend-list a:hover .legend-entry-title,
    .legend-list a:focus-visible .legend-entry-title {
      color: var(--signature);
    }

    .nav-back {
      display: block;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
      text-decoration: none;
    }
    .nav-back:hover, .nav-back:focus-visible { color: var(--ink); }

    @media (max-width: 480px) {
      .wrap { padding: 48px 20px 88px; }
      .entry-body p { font-size: 16px; }
      .entry-image { margin: 36px auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <header class="site-header">
      <h1 class="site-title">My notes, ideas, and things worth sitting with</h1>
    </header>

    <main id="app">
      <!-- content is generated automatically from the ENTRIES list below -->
    </main>

    <footer class="site-footer">
      updated by hand, one entry at a time.
    </footer>

  </div>

  <script>
    /* =====================================================================
       ADD A NEW ENTRY HERE
       ===================================================================== */

    var ENTRIES = [
      {
        id: 'bangalter-mythologies',
        date: '6 August 2026',
        title: 'The dishes are the whole thing',
        body: `
          <a class="video-link" href="https://youtu.be/Etl79iuZxaU" target="_blank" rel="noopener">
            <img class="entry-image" src="https://img.youtube.com/vi/Etl79iuZxaU/maxresdefault.jpg" alt="Thumbnail for the Thomas Bangalter interview — click to watch on YouTube">
            <span class="video-link-label">watch on YouTube &rarr;</span>
          </a>

          <p>I recently watched an interview with Thomas Bangalter, and what stayed with me wasn't really about music at all. It was about control — or the total absence of it.</p>
        
          <p>Daft Punk, he said, was performance art. A line drawn between fiction and reality, not opacity for its own sake, but a kind of disciplined anonymity. Masking identity so the music could reach people without centering it on the self. Pop culture as the director, not him. The duo, a vessel for the voice of the environment</p>
        
          <p>He talked about dance the same way — raw, only existing in that one moment, never experienced the same way twice. Words are reductive next to that kind of depth. His creative process was understanding through feeling, not knowing where it would take him, not taking any of it for granted. The feeling drives the process; the output is just the residue of the whole journey. When asked, he mentioned he hasn't had a recent shift in thinking about anything, because he tries not to walk in with preconceived ideas in the first place. The answer was never going to be found in them.</p>
        
          <p>That stayed with me, because I think a skewed experience of life comes from the same place: the need to be in control of outcomes. The need to control your experience of a moment instead of just having it. The mind can take you so far from the present that you disconnect from your own reality, and the reality in front of you. We physically only ever live in the present. Our bodies only ever live in the present, whether we let ourselves notice or not.</p>
        
          <img class="entry-image" src="images/dirty-dishes.png" alt="Ink sketch of two plates, a bowl, and a mug in a sink, viewed from above, with a fork and spoon resting nearby.">
          
          <p>The most tangible thing is usually the easiest thing to come back to. People say if a task only takes a few minutes, just do it. I don't think that's really about the minutes, or efficiency and optimization of juggling tasks. I think it's because we know our minds will pull us somewhere else the moment we give it the chance — some other version of the task, some list of everything else we could be doing instead of the dishes in front of us. If you didn't need the reasoning at all, if you just started, you'd already be washing them before your mind had the chance to invent anywhere else to be. Being present is powerful precisely because it reconnects you to your immediate environment — the thing technology has gotten so good at removing us from.</p>
        
          <p>That's probably why this interview got me thinking about all of this in the first place. Creativity lives in those moments of presence. We're the vessel for translating the language of our environment into something someone else can experience, and that only works if the person receiving it is present enough to meet it too. To not project their own preconceptions onto it, so they can take the art for what it actually is. That's what it feels like when you connect deeply to music, to a performance like Daft Punk's, or to any other medium. You've met it without the filter of what you expected it to be.</p>
        
          <img class="entry-image" src="images/pre-journey-statechart.svg" alt="State chart showing pre-journey branching into an open minded path toward authentic experience, or a preconceptions path toward filtered experience and fantasy.">
        
          <p>I think we always enter an experience one of two ways: open minded, or with preconceptions already formed. A firsthand experience can be processed a hundred different ways, but preconceptions filter and tint it before you've even had it, sometimes so much that you don't experience it at all. What you get instead isn't a reality. It's a fantasy. A projection you'd already built before you ever arrived. Being open minded doesn't guarantee you the whole of the experience either; you might still only get a subset of what's actually there. But at least it's authentic to what happened, instead of a fantasy standing in for it.</p>
        
          <p>That's the real thread I took from Bangalter, more than anything about music. Letting go of control isn't the same as having no direction. It's what lets an experience - a piece of art, a moment, a life - actually reach you as it is, instead of as the version of it you'd already decided on before living through it.</p>
        `
      },
      {
        id: 'eye-of-the-storm',
        date: '30 July 2026',
        title: 'The eye of the storm',
        body: `
          <p>People feel that stepping away from their world is a way to recharge, to reset. "Away" is a direction, and it points further from you, not closer. The activities that promise distance only expand your range of distractions. You eventually have to return to your world. And even if you come back with a little more energy to handle things, you're still handling the same world you left — except now you have another escape. Another direction to run toward when you feel overwhelmed.</p>

          <img class="entry-image" src="images/eye-of-the-storm-base.svg" alt="Diagram showing both the path outward and the path inward starting from the same layer, your world, with a small center labeled you.">

          <p>The words we use to describe what we need already decide which direction we're facing. "Getting away". "Escaping". "Stepping away from it all". Every one of those phrases points outward, away from yourself, before you've even packed a bag. If the goal is actually to return to yourself, the language has to point inward too.</p>

          <p>I believe that you have to step into the eye of the storm. Not away from it, not away from your world — into it, and through it, to what's at the center. The center of your world. Not deeper into your work, your career, your business, your school. Those are elements of your world, but they aren't your life. People can get so caught up that they mistaken these activities and spaces as their world — their life. But even when these things change, it doesn't mean you change. You are still you. You may or may not be growing with each change, but you are fundamentally at the root of it all.</p>

          <img class="entry-image" src="images/eye-of-the-storm-escape-grows.svg" alt="Diagram showing that when you keep choosing escape, your world and your escapes both grow larger while your sense of self stays the same size.">

          <p>You are at the center of your world. It's the ability to really sit within that and listen to what you need. Not the distractions. Not what you think is your world, because that's what's keeping you distracted. But you. How are you? What do you need? Where are you with yourself?</p>

          <p>Stepping into the center of your world is the most sustainable and scalable thing you can do for yourself. Everything else will reflect that energy and time spent on self, because it is you who is at the center of your world.</p>

          <img class="entry-image" src="images/eye-of-the-storm-return-grows.svg" alt="Diagram showing that when you choose yourself, your core grows while your world keeps its same size and your escapes take up less space.">

          <p>None of this means the activity itself is wrong. It can still look like a vacation, a trip, time away from your usual routine. What changes is the phrasing you carry into it. Are you stepping into that space to hear yourself more clearly, to calm your nervous system? Or are you stepping away, escaping, running from your world? The activity can look identical from the outside. But the words you choose going in decide which direction you're actually walking — toward yourself, or further from it.</p>
        `
      }
    ];

    /* ===================== rendering engine — no need to touch ===================== */

    (function () {
      var app = document.getElementById('app');

      function entryHTML(entry, index) {
        var older = ENTRIES[index + 1];
        var newer = ENTRIES[index - 1];
        var prevLink = older
          ? '<a href="#entry-' + older.id + '" class="nav-arrow" data-target="entry-' + older.id + '" aria-label="Older entry">&larr;</a>'
          : '<span class="nav-arrow nav-arrow--disabled" aria-hidden="true">&larr;</span>';
        var nextLink = newer
          ? '<a href="#entry-' + newer.id + '" class="nav-arrow" data-target="entry-' + newer.id + '" aria-label="Newer entry">&rarr;</a>'
          : '<span class="nav-arrow nav-arrow--disabled" aria-hidden="true">&rarr;</span>';

        return (
          '<div class="view" id="entry-' + entry.id + '">' +
            '<article class="entry">' +
              '<span class="entry-date">' + entry.date + '</span>' +
              '<h2 class="entry-title">' + entry.title + '</h2>' +
              '<div class="entry-body">' + entry.body + '</div>' +
            '</article>' +
            '<nav class="entry-nav">' +
              prevLink +
              '<a href="#legend" class="nav-legend" data-target="legend">all entries</a>' +
              nextLink +
            '</nav>' +
          '</div>'
        );
      }

      function legendHTML() {
        var items = ENTRIES.map(function (entry) {
          return (
            '<li><a href="#entry-' + entry.id + '" data-target="entry-' + entry.id + '">' +
              '<span class="legend-date">' + entry.date + '</span>' +
              '<span class="legend-entry-title">' + entry.title + '</span>' +
            '</a></li>'
          );
        }).join('');

        return (
          '<div class="view" id="legend" hidden>' +
            '<h2 class="legend-title">All entries</h2>' +
            '<ul class="legend-list">' + items + '</ul>' +
            '<a href="#entry-' + ENTRIES[0].id + '" class="nav-back" data-target="entry-' + ENTRIES[0].id + '">&larr; back to latest</a>' +
          '</div>'
        );
      }

      function render() {
        var html = ENTRIES.map(entryHTML).join('') + legendHTML();
        app.innerHTML = html;
      }

      function showView(id) {
        document.querySelectorAll('.view').forEach(function (v) {
          v.hidden = (v.id !== id);
        });
        var target = document.getElementById(id);
        if (target) {
          target.classList.remove('fade-in');
          void target.offsetWidth;
          target.classList.add('fade-in');
          window.scrollTo({ top: 0, behavior: 'instant' });
        }
      }

      function handleHash() {
        var id = location.hash.replace('#', '') || ('entry-' + ENTRIES[0].id);
        showView(id);
      }

      document.addEventListener('click', function (e) {
        var link = e.target.closest('[data-target]');
        if (!link || link.classList.contains('nav-arrow--disabled')) return;
        e.preventDefault();
        var id = link.getAttribute('data-target');
        history.pushState(null, '', '#' + id);
        showView(id);
      });

      window.addEventListener('popstate', handleHash);

      render();
      handleHash();
    })();
  </script>
</body>
</html>
